apiVersion: v1
kind: Pod
metadata:
  name: frontend-pod
  labels:
    app: react-frontend
spec:
  containers:
    - name: frontend-container
      image: yashowardhan777/frontendapp:1.0
      ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-loadbalancer-service
spec:
  type: LoadBalancer
  selector:
    app: react-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
